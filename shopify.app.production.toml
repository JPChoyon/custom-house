# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c4d7bc9a8267eb65f73e4188e88f6eb0"
name = "Custom House Creator"
application_url = "https://custom-house.onrender.com"
embedded = true


[app_proxy]
url = "https://custom-house.onrender.com/proxy"
prefix = "apps"
subpath = "customhouse"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_files,read_metaobjects,read_products,read_publications,write_customers,write_files,write_metaobject_definitions,write_metaobjects,write_products,write_publications"

[auth]
redirect_urls = [ "https://custom-house.onrender.com/api/auth" ]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = ["app/scopes_update"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/collections/delete"
  topics = ["collections/delete"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/delete"
  topics = ["products/delete"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = ["shop/redact"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/create"
  topics = ["customers/create"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/update"
  topics = ["customers/update"]


[build]
automatically_update_urls_on_dev = false
