# Isolated POC configuration. Never use this file for the production app.
client_id = "eb25203ac35156bc6c1e02778a800679"
name = "customhouse-app"
application_url = "https://custom-house-git-feature-inkyba-d7cc48-jp-choyon-khans-projects.vercel.app"
embedded = true

[app_proxy]
url = "/proxy"
prefix = "apps"
subpath = "customhouse-inkybay-preview"

[access_scopes]
scopes = "read_customers,read_files,read_metaobjects,read_orders,read_products,read_publications,write_app_proxy,write_customers,write_files,write_metaobject_definitions,write_metaobjects,write_products,write_publications"

[auth]
redirect_urls = [
  "https://custom-house-git-feature-inkyba-d7cc48-jp-choyon-khans-projects.vercel.app/auth/callback"
]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = ["shop/redact"]

[build]
automatically_update_urls_on_dev = false

# Retained from the active development-app version so the isolated POC release
# is additive and cannot delete existing app-owned definitions.
[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"
